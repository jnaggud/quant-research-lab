[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-lab"
version = "0.1.0"
description = "TradingView strategy validation, quantitative research, and interactive risk dashboards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jefferson Duggan"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "flask>=3.0,<4"]

[project.optional-dependencies]
research = [
  "polars>=1.0,<2", "pyarrow>=15", "databento>=0.50,<1",
  "scikit-learn>=1.4,<2", "hmmlearn>=0.3,<0.4", "optuna>=3.6,<5",
  "requests>=2.31,<3", "yfinance>=0.2,<2", "matplotlib>=3.8,<4",
  "dash>=3,<5", "plotly>=5.20,<7",
]
dev = ["pytest>=8,<10", "build>=1.2,<2"]
animation = ["manimgl>=1.7,<2"]

[tool.setuptools.packages.find]
include = ["quant*", "dashboard*", "polymarket*"]
exclude = ["quant.cache*"]

[tool.setuptools.package-data]
dashboard = ["studio/*", "polymarket_studio/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
markers = ["local_data: requires original private or licensed TradingView exports"]
